[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mhuc"
version = "0.0.1"
description = "MH Ultimate Collection's toolkit: reads, writes and converts the files of MH4U, MH3U and MHXX"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mhuc = "mhuc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# reference/fork.py puts the engine fork's tools on sys.path, so it is imported before them.
section-order = ["future", "standard-library", "fork", "third-party", "first-party", "local-folder"]
sections = { fork = ["fork"] }
